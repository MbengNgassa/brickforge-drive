<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2636"/>
      <stop offset="100%" stop-color="#0d121a"/>
    </linearGradient>
    <linearGradient id="redBrick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff493c"/>
      <stop offset="100%" stop-color="#c91f17"/>
    </linearGradient>
    <linearGradient id="yellowBrick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd53d"/>
      <stop offset="100%" stop-color="#e59d00"/>
    </linearGradient>
    <linearGradient id="jet" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#4be4ff"/>
      <stop offset="100%" stop-color="#0077ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Boost flame trail -->
  <path d="M 38 308 L 150 282 L 150 342 Z" fill="url(#jet)"/>
  <path d="M 58 292 L 154 276 L 154 316 Z" fill="url(#jet)" opacity="0.8"/>
  <!-- Studs on top cab -->
  <rect x="196" y="138" width="46" height="24" rx="8" fill="#ffd53d"/>
  <rect x="256" y="138" width="46" height="24" rx="8" fill="#ffd53d"/>
  <!-- Cab brick -->
  <rect x="176" y="156" width="150" height="84" rx="14" fill="url(#yellowBrick)"/>
  <!-- Translucent blue windshield -->
  <polygon points="310,164 358,234 310,234" fill="#63d8ff" opacity="0.85"/>
  <!-- Chassis studs -->
  <rect x="148" y="216" width="42" height="20" rx="6" fill="#ff5e52"/>
  <rect x="356" y="216" width="42" height="20" rx="6" fill="#ff5e52"/>
  <!-- Main red chassis brick -->
  <rect x="128" y="232" width="292" height="96" rx="16" fill="url(#redBrick)"/>
  <!-- Headlight glow -->
  <rect x="404" y="254" width="22" height="30" rx="6" fill="#fff7b8"/>
  <!-- Thruster nozzle -->
  <rect x="108" y="264" width="28" height="44" rx="6" fill="#3a4454"/>
  <!-- Wheels -->
  <circle cx="192" cy="340" r="56" fill="#181c22" stroke="#2c3340" stroke-width="10"/>
  <circle cx="192" cy="340" r="24" fill="#cfd8e3"/>
  <circle cx="192" cy="340" r="9" fill="#445063"/>
  <circle cx="352" cy="340" r="56" fill="#181c22" stroke="#2c3340" stroke-width="10"/>
  <circle cx="352" cy="340" r="24" fill="#cfd8e3"/>
  <circle cx="352" cy="340" r="9" fill="#445063"/>
</svg>